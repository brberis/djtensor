upstream backend {
    server backend:8000;
}

upstream nextjs {
    server frontend:3000;
}

# Behind the Cloudflare tunnel, TLS terminates at Cloudflare and cloudflared
# forwards plain HTTP to this nginx. Preserve the real client scheme so Django
# (with SECURE_PROXY_SSL_HEADER) knows the request was HTTPS and builds https://
# absolute URLs. Falls back to $scheme for direct/loopback access.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {

    listen 80;
    client_max_body_size 1G;
    server_name fossil.barberis.com;

    location / {
        proxy_pass http://nextjs;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 1G;

    }

    # SSE log streaming - direct to backend, no buffering
    location ~ ^/api/feature_extractor/trainingsession/\d+/logs/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Training session actions (retrain, stop) - direct to backend
    location ~ ^/api/feature_extractor/trainingsession/\d+/(retrain|stop)/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://nextjs;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 1G;

    }

    location /auth/api/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /data/api/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 1G;

    }

    location /static/ {
        alias /usr/src/app/staticfiles/;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /media/ {
        alias /usr/src/app/mediafiles/;
    }

}
